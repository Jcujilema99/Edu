<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #171717;
      font-family: Arial, sans-serif;
    }

    .calculadora {
      width: 340px;
      padding: 20px;
      background: #252525;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #pantalla {
      width: 100%;
      height: 80px;
      margin-bottom: 15px;
      padding: 15px;

      border: none;
      border-radius: 12px;
      outline: none;

      background: #101010;
      color: white;

      font-size: 32px;
      text-align: right;
    }

    .botones {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 65px;
      border: none;
      border-radius: 12px;

      background: #3a3a3a;
      color: white;

      font-size: 22px;
      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      background: #505050;
    }

    button:active {
      transform: scale(0.95);
    }

    .operador {
      background: #ff9500;
    }

    .operador:hover {
      background: #e98900;
    }

    .limpiar {
      background: #dc3545;
    }

    .igual {
      background: #28a745;
    }

    .cero {
      grid-column: span 2;
    }
  </style>
</head>

<body>

  <div class="calculadora">

    <input type="text" id="pantalla" readonly>

    <div class="botones">

      <button class="limpiar" onclick="limpiar()">C</button>
      <button onclick="borrar()">⌫</button>
      <button onclick="agregar('%')">%</button>
      <button class="operador" onclick="agregar('/')">÷</button>

      <button onclick="agregar('7')">7</button>
      <button onclick="agregar('8')">8</button>
      <button onclick="agregar('9')">9</button>
      <button class="operador" onclick="agregar('*')">×</button>

      <button onclick="agregar('4')">4</button>
      <button onclick="agregar('5')">5</button>
      <button onclick="agregar('6')">6</button>
      <button class="operador" onclick="agregar('-')">−</button>

      <button onclick="agregar('1')">1</button>
      <button onclick="agregar('2')">2</button>
      <button onclick="agregar('3')">3</button>
      <button class="operador" onclick="agregar('+')">+</button>

      <button class="cero" onclick="agregar('0')">0</button>
      <button onclick="agregar('.')">.</button>
      <button class="igual" onclick="calcular()">=</button>

    </div>
  </div>

  <script>
    const pantalla = document.getElementById("pantalla");

    // Agregar números y operadores
    function agregar(valor) {
      pantalla.value += valor;
    }

    // Limpiar toda la pantalla
    function limpiar() {
      pantalla.value = "";
    }

    // Borrar el último carácter
    function borrar() {
      pantalla.value = pantalla.value.slice(0, -1);
    }

    // Realizar la operación
    function calcular() {
      try {
        if (pantalla.value === "") {
          return;
        }

        const resultado = Function(
          '"use strict"; return (' + pantalla.value + ')'
        )();

        pantalla.value = resultado;
      } catch (error) {
        pantalla.value = "Error";
      }
    }

    // Usar la calculadora con el teclado
    document.addEventListener("keydown", function(event) {
      const tecla = event.key;

      if ("0123456789+-*/.%".includes(tecla)) {
        agregar(tecla);
      }

      if (tecla === "Enter") {
        calcular();
      }

      if (tecla === "Backspace") {
        borrar();
      }

      if (tecla === "Escape") {
        limpiar();
      }
    });
  </script>

</body>
</html>
